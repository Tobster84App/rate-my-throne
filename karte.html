/* Layout: königliche Kopfleiste, Vollbild-Karte, Infokarte rechts (Handy: oben), runde Kartenknöpfe links unten, Details als Bottom-Sheet */

.progress i { display: block; height: 100%; background: var(--gold); }
.fab-badge { position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; background: var(--gold); color: var(--royal); font: 800 12px/20px var(--display); text-align: center; }

#status { position: absolute; z-index: 950; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: calc(100% - 160px);

  max-height: 78%; overflow-y: auto; background: var(--surface); border-radius: 20px 20px 0 0; box-shadow: var(--shadow);

#sheet h2 { margin: 0 0 4px; font: 800 22px/1.15 var(--display); text-wrap: balance; padding-right: 40px; }
.close { position: absolute; top: 14px; right: 14px; width: 34px; height: 34px; border-radius: 50%; border: none; background: var(--bg); color: var(--fg); font-size: 18px; line-height: 1; }
.muted { color: var(--muted); font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }

.bar i { display: block; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }

.badge { display: inline-block; font-size: 12px; font-weight: 700; color: var(--royal); background: var(--gold); border-radius: 999px; padding: 3px 10px; margin: 2px 0 6px; }

document.title = t("m.title");

function status(msg, ms) {
  const el = document.getElementById("status");
  el.textContent = msg; el.hidden = !msg;

function avg(id) {
  const list = reviews.get(id) || [];
  if (!list.length) return null;
  return list.reduce((s, r) => s + CATS.reduce((a, c) => a + r[c.key], 0) / CATS.length, 0) / list.length;
}
const scoreColor = a => a == null ? "var(--none)" : a >= 4 ? "var(--good)" : a >= 2.5 ? "var(--mid)" : "var(--bad)";

function markerIcon(tl) {
  const a = avg(tl.id);
  const cls = "pin" + (a == null ? " none" : "") + (tl.id === nearestId ? " nearest" : "");
  return L.divIcon({ className: "", iconSize: [38, 38], iconAnchor: [19, 40],
    html: `<div class="${cls}" style="background:${scoreColor(a)}"><b>${a == null ? "WC" : fmtNum(a, 1)}</b></div>` });
}

// ===== Filter: kostenlos, barrierefrei, Wickeltisch, ab 4 Sternen, nur bewertete =====
// Toiletten ohne Angabe bleiben bei den Ausstattungs-Filtern sichtbar; ausgeblendet wird nur, was ausdrücklich nicht passt.
const FILTERS = ["open", "free", "wheelchair", "changing", "family", "good", "rated"];
let filters = new Set();
try { filters = new Set(JSON.parse(localStorage.getItem("rmt-filters") || "[]").filter(f => FILTERS.includes(f))); } catch {}

// Ausstattung aus OSM bzw. Eintrag; „ja“ auch, wenn mindestens die Hälfte der Bewertungen es ankreuzt.
// Ergebnis: "yes", "no", "limited" oder undefined (noch keine Angabe)
function feature(tl, key) {
  const list = reviews.get(tl.id) || [];
  if (key === "family") {
    // Nur aus Bewertungen: „ja“, wenn mindestens die Hälfte der Bewertungen mit Angabe es ankreuzt
    const rated = list.filter(r => r.family != null);
    if (!rated.length) return undefined;
    return rated.filter(r => r.family).length * 2 >= rated.length ? "yes" : "no";
  }
  const reviewKey = { free: "free", wheelchair: "barrierfree", changing: "changing" }[key];
  const tag = key === "free" ? (tl.fee === "no" ? "yes" : tl.fee === "yes" ? "no" : undefined) : tl[key];
  if (tag === "yes" || (list.length && list.filter(r => r[reviewKey]).length * 2 >= list.length)) return "yes";
  return tag === "no" || tag === "limited" ? tag : undefined;
}
function passes(tl) {
  for (const f of filters) {
    if (f === "open" && OH.isOpen(tl.hours) === false) return false;   // ohne verständliche Öffnungszeiten bleibt sie sichtbar
    if (f === "rated" && avg(tl.id) == null) return false;
    if (f === "good" && !(avg(tl.id) >= 4)) return false;
    if (f === "family" && feature(tl, "family") !== "yes") return false;
    if (["free", "wheelchair", "changing"].includes(f) && feature(tl, f) === "no") return false;
  }
  return true;
}
const shown = () => [...toilets.values()].filter(passes);

function render() {
  layer.clearLayers();
  for (const tl of shown()) {
    L.marker([tl.lat, tl.lon], { icon: markerIcon(tl), zIndexOffset: tl.id === nearestId ? 1000 : 0 })
      .on("click", () => showToilet(tl)).addTo(layer);
  }
  updateInfo();
}

// ===== Entfernungen & Infokarte =====
function distance(a, b) { // Meter, Haversine
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (b[0] - a[0]) * rad, dLon = (b[1] - a[1]) * rad;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * rad) * Math.cos(b[0] * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const fmtDist = m => m < 1000 ? Math.round(m / 10) * 10 + " m" : fmtNum(m / 1000, 1) + " km";
const walkMin = m => Math.max(1, Math.round(m / 80)); // ca. 4,8 km/h

function nearestFrom(pos) {
  let best = null, bestD = Infinity;
  for (const tl of shown()) {
    const d = distance(pos, [tl.lat, tl.lon]);
    if (d < bestD) { best = tl; bestD = d; }
  }
  return best && { toilet: best, dist: bestD };
}

function updateInfo() {
  const b = map.getBounds();
  const visible = shown().filter(tl => b.contains([tl.lat, tl.lon]));
  document.getElementById("sCount").textContent = visible.length;
  document.getElementById("sCountNote").textContent = t(filters.size ? "m.info.toiletsFiltered" : "m.info.toiletsNote");
  const rated = visible.map(tl => avg(tl.id)).filter(a => a != null);
  const sAvg = document.getElementById("sAvg");
  if (rated.length) {
    const m = rated.reduce((s, a) => s + a, 0) / rated.length;
    sAvg.textContent = fmtNum(m, 1);
    sAvg.style.color = scoreColor(m);
    document.getElementById("sAvgNote").textContent = t("m.info.ratedOf", { n: rated.length, m: visible.length });
  } else {
    sAvg.textContent = "–"; sAvg.style.color = "";
    document.getElementById("sAvgNote").textContent = t("m.info.noReviews");
  }
  const from = planPos || myPos || [map.getCenter().lat, map.getCenter().lng];
  const n = nearestFrom(from);
  document.getElementById("sNear").textContent = n ? fmtDist(n.dist) : "–";
  document.getElementById("sNearNote").textContent = n ? (planPos ? t("m.info.fromPlan", { min: walkMin(n.dist) }) : myPos ? t("m.info.fromYou", { min: walkMin(n.dist) }) : t("m.info.fromCenter")) : t("m.info.noneLoaded");
}

// ===== Daten laden =====
// Alle Toiletten kommen aus unserer Datenbank: osm_toilets (Kopie aus OpenStreetMap) und toilets (Community).
// Abgefragt wird in Kacheln von 0,05° (ca. 4–5 km); jede Kachel nur einmal pro Besuch.
// Kennt die Datenbank eine Gegend noch nicht (1°-Kachel), stößt die App einmalig den Import an.
const TILE = 0.05;
const loadedTiles = new Set();
const importAsked = new Set();

function tilesFor(bounds, size) {
  const out = [];
  for (let y = Math.floor(bounds.getSouth() / size); y <= Math.floor(bounds.getNorth() / size); y++)
    for (let x = Math.floor(bounds.getWest() / size); x <= Math.floor(bounds.getEast() / size); x++) out.push(x + "_" + y);
  return out;
}
function unionBox(keys, size) {
  const xs = keys.map(k => +k.split("_")[0]), ys = keys.map(k => +k.split("_")[1]);
  return [Math.min(...ys) * size, Math.min(...xs) * size, (Math.max(...ys) + 1) * size, (Math.max(...xs) + 1) * size];
}

async function loadOsm(box) {
  const { data, error } = await db.from("osm_toilets").select("id,lat,lon,name,operator,fee,wheelchair,changing_table,opening_hours")
    .gte("lat", box[0]).lte("lat", box[2]).gte("lon", box[1]).lte("lon", box[3]).limit(5000);
  if (error) throw new Error(t("m.err.osm") + ": " + error.message);
  for (const r of data) {
    toilets.set(r.id, { id: r.id, lat: r.lat, lon: r.lon, source: "OpenStreetMap",
      name: r.name || r.operator || t("m.toilet.default"),
      fee: r.fee, wheelchair: r.wheelchair, changing: r.changing_table, hours: r.opening_hours });
  }
}

const yn = v => v == null ? undefined : v ? "yes" : "no";
async function loadOwn(box) {
  const { data, error } = await db.from("toilets").select("*, profiles(username)")
    .gte("lat", box[0]).lte("lat", box[2]).gte("lon", box[1]).lte("lon", box[3]);
  if (error) throw new Error(t("m.err.own") + ": " + error.message);
  for (const tl of data) {
    toilets.set(tl.id, { id: tl.id, lat: tl.lat, lon: tl.lon, name: tl.name, own: true, createdBy: tl.created_by,
      source: tl.profiles?.username ? t("m.toilet.by", { u: tl.profiles.username }) : t("m.toilet.community"),
      fee: yn(tl.fee), wheelchair: yn(tl.wheelchair), changing: yn(tl.changing_table) });
  }
}

async function loadReviews(ids) {
  for (let i = 0; i < ids.length; i += 100) {
    const chunk = ids.slice(i, i + 100);
    const { data, error } = await db.from("reviews").select("*, profiles(username)").in("toilet_ref", chunk);
    if (error) throw new Error(t("m.err.reviews") + ": " + error.message);
    for (const id of chunk) reviews.set(id, []);
    for (const r of data) reviews.get(r.toilet_ref).push(r);
    await loadCounts(data.map(r => r.user_id));
    // Kurzmeldungen und Daumen (fehlen die Tabellen noch, bleibt es einfach leer)
    const since = new Date(Date.now() - 90 * 864e5).toISOString();
    const [rep, vot] = await Promise.all([
      db.from("toilet_reports").select("toilet_ref,kind,created_at,user_id").in("toilet_ref", chunk).gte("created_at", since).order("created_at", { ascending: false }),
      db.from("toilet_votes").select("toilet_ref,up,created_at").in("toilet_ref", chunk).gte("created_at", since)]);
    for (const id of chunk) live.set(id, { reports: [], votes: [] });
    (rep.data ?? []).forEach(r => live.get(r.toilet_ref)?.reports.push(r));
    (vot.data ?? []).forEach(v => live.get(v.toilet_ref)?.votes.push(v));
  }
}

// Lädt die noch fehlenden 0,05°-Kacheln im sichtbaren Bereich aus der Datenbank
async function loadArea(bounds) {
  const keys = tilesFor(bounds, TILE).filter(k => !loadedTiles.has(k));
  if (!keys.length) return [];
  keys.forEach(k => loadedTiles.add(k));
  const box = unionBox(keys, TILE);
  const failed = [];
  await Promise.all([loadOsm(box), loadOwn(box)].map(p => p.catch(err => { failed.push(err.message); keys.forEach(k => loadedTiles.delete(k)); })));
  try { await loadReviews([...toilets.keys()].filter(id => !reviews.has(id))); } catch (err) { failed.push(err.message); }
  render();
  return failed;
}

// Stößt den Import für Gegenden an, die die Datenbank noch nicht kennt.
// Ergebnis: fresh = neue Daten da, busy = Import läuft noch woanders oder schlug fehl
let retryTimer;
async function ensureImported(bounds) {
  const keys = tilesFor(bounds, 1).filter(k => !importAsked.has(k)).slice(0, 2);
  if (!keys.length) return {};
  keys.forEach(k => importAsked.add(k));
  const { data: rows, error } = await db.from("osm_tiles").select("key,status").in("key", keys);
  if (error) return {};
  const ok = new Set(rows.filter(r => r.status === "ok").map(r => r.key));
  const missing = keys.filter(k => !ok.has(k));
  if (!missing.length) return {};
  status(t("m.status.importing"));
  await db.rpc("request_osm_tiles", { keys: missing });
  // Die Datenbank holt die Daten im Hintergrund; alle 5 s nachsehen, höchstens 90 s lang
  const done = new Set();
  for (let i = 0; i < 18 && done.size < missing.length; i++) {
    await new Promise(res => setTimeout(res, 5000));
    const { data } = await db.from("osm_tiles").select("key,status").in("key", missing);
    (data ?? []).filter(r => r.status === "ok").forEach(r => done.add(r.key));
    if ((data ?? []).length === missing.length && data.every(r => r.status === "ok" || r.status === "error")) break;
  }
  const notDone = missing.filter(k => !done.has(k));
  if (notDone.length) {
    // Läuft gerade woanders oder ist fehlgeschlagen: später nochmal versuchen
    notDone.forEach(k => importAsked.delete(k));
    clearTimeout(retryTimer); retryTimer = setTimeout(loadToilets, 30000);
  }
  return { fresh: done.size > 0, busy: notDone.length > 0 && !done.size };
}

async function loadToilets() {
  if (map.getZoom() < 13) { status(t("m.status.zoom"), 2500); updateInfo(); return; }
  const b = map.getBounds();
  if (tilesFor(b, TILE).some(k => !loadedTiles.has(k))) status(t("m.status.loading"));
  const failed = await loadArea(b);
  const imp = await ensureImported(b);
  if (imp.fresh) {
    tilesFor(b, TILE).forEach(k => loadedTiles.delete(k));
    failed.push(...await loadArea(b));
  }
  if (failed.length) status(t("m.status.partial", { e: failed.join("; ") }), 6000);
  else if (imp.busy) status(t("m.status.importBusy"), 5000);
  else status("");
  updateInfo();
}
let moveTimer;
map.on("moveend", () => {
  updateInfo(); clearTimeout(moveTimer); moveTimer = setTimeout(loadToilets, 400);
  try { const c = map.getCenter(); localStorage.setItem("rmt-view", JSON.stringify({ lat: +c.lat.toFixed(5), lon: +c.lng.toFixed(5), z: map.getZoom() })); } catch {}
});

// ===== Standort & nächster Thron =====
function locate() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error(t("m.err.noGeo")));
    navigator.geolocation.getCurrentPosition(p => {
      myPos = [p.coords.latitude, p.coords.longitude];
      if (meMarker) meMarker.setLatLng(myPos);
      else meMarker = L.marker(myPos, { icon: L.divIcon({ className: "", iconSize: [18, 18], html: '<div class="me"></div>' }), interactive: false }).addTo(map);
      resolve(myPos);
    }, () => reject(new Error(t("m.err.geo"))), { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
  });
}

document.getElementById("btnLocate").onclick = async () => {
  clearPlan();
  status(t("m.status.locating"));
  try { const pos = await locate(); map.setView(pos, 16); status(""); }
  catch (err) { status(err.message, 4000); }
};

document.getElementById("btnNearest").onclick = async () => {
  status(t("m.status.searching"));
  let from = planPos;   // Gesuchter Ort hat Vorrang vor dem eigenen Standort
  if (!from) {
    try { from = await locate(); }
    catch { from = [map.getCenter().lat, map.getCenter().lng]; status(t("m.status.fallback"), 2500); }
  }
  map.setView(from, Math.max(map.getZoom(), 15), { animate: false });
  clearTimeout(moveTimer);
  await loadToilets();
  const n = nearestFrom(from);
  if (!n) { status(t("m.status.none"), 4000); return; }
  nearestId = n.toilet.id;
  if (routeLine) routeLine.remove();
  routeLine = L.polyline([from, [n.toilet.lat, n.toilet.lon]], { color: "#e3b341", weight: 4, dashArray: "6 8" }).addTo(map);
  render();
  map.fitBounds(L.latLngBounds([from, [n.toilet.lat, n.toilet.lon]]).pad(0.4), { maxZoom: 17 });
  status("");
  showToilet(n.toilet, n.dist);
};

// ===== Ortssuche (Nominatim von OpenStreetMap): Toilettenpausen vorab planen =====
// Gesucht wird nur auf Knopfdruck, nicht bei jedem Tastendruck (Nutzungsregeln von Nominatim: höchstens 1 Anfrage pro Sekunde).
let planMarker = null, lastSearch = 0;
function setPlan(lat, lon, name) {
  planPos = [lat, lon];
  if (planMarker) planMarker.setLatLng(planPos);
  else planMarker = L.marker(planPos, { icon: L.divIcon({ className: "", iconSize: [30, 30], iconAnchor: [15, 28], html: '<div class="plan-pin">📍</div>' }), interactive: false, zIndexOffset: 2000 }).addTo(map);
  document.getElementById("planName").textContent = name;
  document.getElementById("planBar").hidden = false;
  nearestId = null; if (routeLine) { routeLine.remove(); routeLine = null; }
  map.setView(planPos, 16);
  updateInfo();
}
function clearPlan() {
  if (!planPos) return;
  planPos = null;
  if (planMarker) { planMarker.remove(); planMarker = null; }
  document.getElementById("planBar").hidden = true;
  updateInfo();
}
document.getElementById("planClear").onclick = clearPlan;
document.getElementById("btnSearch").onclick = () => {
  sheet.innerHTML = `${closeBtn()}<h2>${t("s.title")}</h2>
    <p class="muted">${t("s.hint")}</p>
    <form id="searchForm"><input type="text" id="sQuery" required minlength="2" maxlength="120" autocomplete="off" placeholder="${t("s.placeholder")}">
    <div class="actions"><button type="submit" class="btn primary" id="sGo">${t("s.go")}</button></div></form>
    <p class="error" id="sMsg"></p><ul class="results" id="sResults"></ul>
    <p class="muted">${t("s.credit")}</p>`;
  sheet.hidden = false;
  const input = document.getElementById("sQuery"), msg = document.getElementById("sMsg"), list = document.getElementById("sResults"), go = document.getElementById("sGo");
  input.focus();
  document.getElementById("searchForm").onsubmit = async e => {
    e.preventDefault();
    if (Date.now() - lastSearch < 1100) return;
    lastSearch = Date.now();
    go.disabled = true; msg.className = "muted"; msg.textContent = t("s.searching"); list.innerHTML = "";
    try {
      const res = await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=" + LANG + "&q=" + encodeURIComponent(input.value.trim()));
      if (!res.ok) throw new Error("HTTP " + res.status);
      const places = await res.json();
      msg.className = "error"; msg.textContent = places.length ? "" : t("s.none");
      list.innerHTML = places.map((p, i) => {
        const parts = p.display_name.split(", ");
        return `<li><button type="button" data-i="${i}"><b>${esc(parts[0])}</b><small>${esc(parts.slice(1, 4).join(", "))}</small></button></li>`;
      }).join("");

        const p = places[+btn.dataset.i];
        closeSheet();
        setPlan(+p.lat, +p.lon, p.display_name.split(", ").slice(0, 2).join(", "));
      });
    } catch (err) {
      msg.className = "error"; msg.textContent = t("s.failed", { e: err.message });
    } finally { go.disabled = false; }
  };
};

        <div class="muted">${CATS.map(c => c.label + " " + r[c.key]).join(" · ")}${r.free ? " · " + t("m.review.free") : ""}${r.barrierfree ? " · " + t("m.review.barrierfree") : ""}${r.changing ? " · " + t("m.review.changing") : ""}</div>
        ${r.comment ? `<p>${esc(r.comment)}</p>` : ""}
        ${reviewActions(r)}</div>`).join("")}</div>`;
  sheet.hidden = false;
  bindReviewActions(tl);
  bindToiletDelete(tl);
  bindLive(tl);
  document.getElementById("shareBtn").onclick = () => shareToilet(tl);
  const area = document.getElementById("formArea");
  if (!user) {
    area.innerHTML = `<button type="button" class="btn primary" id="loginToRate">${t("m.detail.loginToRate")}</button>`;
    document.getElementById("loginToRate").onclick = () => showAuth(() => showToilet(tl, dist));
  } else {
    // Erneut bewerten ist frühestens 30 Tage nach der letzten eigenen Bewertung möglich
    const last = list.filter(r => r.user_id === user.id).map(r => new Date(r.created_at)).sort((x, y) => y - x)[0];
    const next = last && new Date(last.getTime() + 30 * 864e5);

      area.innerHTML = `<span class="muted">${t("hist.wait", { d: last.toLocaleDateString(LOCALE), next: next.toLocaleDateString(LOCALE) })}</span>`;
    } else {
      area.innerHTML = `<button type="button" class="btn primary" id="rateBtn">${last ? t("hist.again") : t("m.detail.rate")}</button>`;
      document.getElementById("rateBtn").onclick = () => showRatingForm(tl);
    }
  }
}

// ===== Aktualität: „zuletzt geprüft“, Kurzmeldungen (mit Konto) und Daumen (ohne Konto) =====
const LIVE_KINDS = ["ok", "no_paper", "dirty", "closed", "broken"];
const LIVE_HOURS = 48;
function ago(date) {
  const min = Math.round((Date.now() - new Date(date)) / 60000);
  if (min < 2) return t("ago.now");
  if (min < 60) return t("ago.min", { n: min });
  if (min < 24 * 60) return t("ago.h", { n: Math.round(min / 60) });
  const d = Math.round(min / 1440);
  return d === 1 ? t("ago.d1") : t("ago.d", { n: d });
}
function liveHtml(tl) {
  const l = live.get(tl.id) || { reports: [], votes: [] };
  const times = [...l.reports, ...l.votes, ...(reviews.get(tl.id) || [])].map(x => Date.parse(x.created_at));
  const last = times.length ? Math.max(...times) : null;
  const cut = Date.now() - LIVE_HOURS * 36e5;
  const recent = l.reports.filter(r => Date.parse(r.created_at) >= cut);
  const latest = LIVE_KINDS.map(k => recent.find(r => r.kind === k)).filter(Boolean);   // je Art die neueste
  const votes = l.votes.filter(v => Date.parse(v.created_at) >= cut);
  const up = votes.filter(v => v.up).length, down = votes.length - up;
  const voted = localVote(tl.id);
  return `<div><b>${last ? t("live.checked", { ago: ago(last) }) : t("live.never")}</b></div>
    ${latest.length ? `<div class="row">${latest.map(r => `<span class="tag ${r.kind === "ok" ? "" : "warn"}">${t("live.k." + r.kind)} · ${ago(r.created_at)}</span>`).join("")}</div>` : ""}
    ${votes.length ? `<div class="muted">${t("live.votes", { up, down })}</div>` : ""}
    <div class="row"><span>${t("live.voteHint")}</span><button type="button" class="btn small" data-vote="1" ${voted ? "disabled" : ""}>👍</button><button type="button" class="btn small" data-vote="0" ${voted ? "disabled" : ""}>👎</button></div>
    ${user ? `${voted ? `<div class="muted">${t("live.votedAlready")}</div>` : ""}
      <div class="row"><button type="button" class="btn small" id="liveAsk">${t("live.ask")}</button></div>
      <div class="row" id="liveKinds" hidden>${LIVE_KINDS.map(k => `<button type="button" class="btn small" data-kind="${k}">${t("live.k." + k)}</button>`).join("")}</div>`
    : `<div class="muted">${voted ? t("live.votedAlready") : t("live.loginMore")}</div>`}
    <p class="error" id="liveMsg"></p>`;
}
// Ohne Konto: höchstens ein Daumen pro Toilette und Tag (im Browser gemerkt)
function localVote(id, set) {
  try {
    const all = JSON.parse(localStorage.getItem("rmt-votes") || "{}");
    if (set) { all[id] = Date.now(); localStorage.setItem("rmt-votes", JSON.stringify(all)); return true; }
    return all[id] && Date.now() - all[id] < 864e5;
  } catch { return false; }
}
function bindLive(tl) {
  const box = document.getElementById("liveBox"), msg = () => document.getElementById("liveMsg");
  const refresh = () => { box.innerHTML = liveHtml(tl); bindLive(tl); };
  const entry = () => { if (!live.has(tl.id)) live.set(tl.id, { reports: [], votes: [] }); return live.get(tl.id); };
  const ask = document.getElementById("liveAsk");
  if (ask) ask.onclick = () => { document.getElementById("liveKinds").hidden = false; ask.hidden = true; };
  box.querySelectorAll("[data-kind]").forEach(btn => btn.onclick = async () => {
    const { data, error } = await db.from("toilet_reports").insert({ toilet_ref: tl.id, kind: btn.dataset.kind }).select("toilet_ref,kind,created_at,user_id").single();
    if (error) { msg().textContent = error.code === "42501" ? t("live.tooSoon") : t("live.failed", { e: error.message }); return; }
    entry().reports.unshift(data); refresh(); msg().className = "ok"; msg().textContent = t("live.thanks");
  });
  box.querySelectorAll("[data-vote]").forEach(btn => btn.onclick = async () => {
    const up = btn.dataset.vote === "1";
    const { error } = await db.rpc("vote_toilet", { ref: tl.id, is_up: up });
    if (error) { msg().textContent = t("live.failed", { e: error.message }); return; }
    localVote(tl.id, true);
    entry().votes.push({ toilet_ref: tl.id, up, created_at: new Date().toISOString() });
    refresh(); msg().className = "ok"; msg().textContent = t("live.thanks");
  });
}

// Detail-Kriterien aus den Bewertungen: „Papier: 4 von 5“ (nur Bewertungen mit Angabe zählen)
const CRITS = ["paper", "soap", "dryer", "smell_ok", "lock_ok", "stroller", "kids_seat"];
function critHtml(list) {
  const rows = CRITS.map(k => {
    const rated = list.filter(r => r[k] != null);
    return rated.length ? `<span>${t("crit." + k)}: <b>${t("crit.of", { k: rated.filter(r => r[k]).length, n: rated.length })}</b></span>` : "";
  }).filter(Boolean);
  return rows.length ? `<div class="muted">${t("crit.title")}</div><div class="crit">${rows.join("")}</div>` : "";
}

// Gesamtnote einer einzelnen Bewertung
const revScore = r => CATS.reduce((a, c) => a + r[c.key], 0) / CATS.length;

// Vergleich: Bewertungen der letzten 3 Monate gegen die älteren (nur wenn es beides gibt)
function trendLine(list) {
  const cut = Date.now() - 90 * 864e5;
  const recent = list.filter(r => Date.parse(r.created_at) >= cut), older = list.filter(r => Date.parse(r.created_at) < cut);
  if (!recent.length || !older.length) return "";
  const mean = l => l.reduce((s, r) => s + revScore(r), 0) / l.length;
  const a = mean(recent), b = mean(older), diff = a - b;
  const verdict = diff >= 0.3 ? `<span class="up">↑ ${t("hist.better")}</span>` : diff <= -0.3 ? `<span class="down">↓ ${t("hist.worse")}</span>` : `<span>→ ${t("hist.same")}</span>`;
  return `<div class="trend"><span>${t("hist.recent")}: <b>${fmtNum(a, 1)}</b></span><span>${t("hist.before")}: <b>${fmtNum(b, 1)}</b></span>${verdict}</div>`;
}

// ===== Moderation: eigene Bewertungen löschen, fremde melden; Admins dürfen alles löschen =====
function reviewActions(r) {
  if (!user) return "";

  const parts = [];
  if (own || user.isAdmin) parts.push(`<button type="button" class="btn small danger" data-del="${r.id}">${t("mod.delete")}</button>`);

                                            : `<button type="button" class="btn small" data-rep="${r.id}">${t("mod.report")}</button>`);
  return `<div class="rev-actions">${parts.join("")}</div>`;
}

// Löscht eine Bewertung; gibt eine Fehlermeldung zurück oder null
async function deleteReview(id) {
  const { data, error } = await db.from("reviews").delete().eq("id", id).select("id");
  if (error) return t("mod.deleteFailed", { e: error.message });
  if (!data.length) return t("mod.notAllowed");   // von den Zugriffsregeln abgelehnt
  for (const [key, list] of reviews) reviews.set(key, list.filter(r => r.id !== id));
  render();
  return null;
}

      <p class="error" id="authErr"></p>
      <div class="actions"><button type="submit" class="btn primary">${reg ? t("auth.register") : t("auth.login")}</button>
      <button type="button" class="btn" id="switchMode">${reg ? t("auth.haveAccount") : t("auth.newAccount")}</button></div>
      ${reg ? "" : `<button type="button" class="linkbtn" id="forgot">${t("auth.forgot")}</button>`}
    </form>`;
  sheet.hidden = false;
  document.getElementById("switchMode").onclick = () => showAuth(after, reg ? "login" : "register");

    if (reg) {
      const username = aUser.value.trim();

      if (taken?.length) { err.textContent = t("auth.taken"); return; }
      const { data, error } = await db.auth.signUp({ email, password, options: { data: { username, lang: LANG } } });
      if (error) { err.textContent = t("auth.regFailed", { e: error.message }); return; }

        sheet.innerHTML = `${closeBtn()}<h2>${t("auth.almostTitle")}</h2><p>${t("auth.almostText", { email: esc(email) })}</p>`;

      if (error) { err.textContent = error.message === "Email not confirmed" ? t("auth.confirmFirst") : t("auth.wrong"); return; }
    }
    await refreshUser();
    after ? after() : closeSheet();
  };

async function refreshUser() {
  const { data: { session } } = await db.auth.getSession();
  myReports = new Set();
  if (session) {
    const { data } = await db.from("profiles").select("username,is_admin").eq("id", session.user.id).single();
    user = { id: session.user.id, username: data?.username ?? session.user.email, isAdmin: !!data?.is_admin, openReports: 0 };
    const { data: mine } = await db.from("review_reports").select("review_id").eq("reporter", user.id);
    (mine ?? []).forEach(r => myReports.add(r.review_id));
    if (user.isAdmin) {
      const { data: all } = await db.from("review_reports").select("review_id");
      user.openReports = new Set((all ?? []).map(r => r.review_id)).size;
    }

  const btn = document.getElementById("btnUser");
  btn.textContent = user ? "👑 " + user.username + (user.openReports ? " (" + user.openReports + ")" : "") : t("auth.login");
}

// ===== Teilen: Link auf genau diese Toilette (Handy: Teilen-Menü des Systems, sonst WhatsApp oder Link kopieren) =====
async function shareToilet(tl) {
  const url = `https://www.rate-my-throne.com/karte.html?${LANG === "en" ? "lang=en&" : ""}toilette=${encodeURIComponent(tl.id)}`;
  const a = avg(tl.id);
  const text = a != null ? t("share.textRated", { name: tl.name, s: fmtNum(a, 1) }) : t("share.text", { name: tl.name });
  if (navigator.share) {
    try { await navigator.share({ title: "Rate My Throne", text, url }); return; }
    catch (e) { if (e.name === "AbortError") return; }   // abgebrochen: nichts tun; sonst Ersatz zeigen
  }
  const alt = document.getElementById("shareAlt");
  alt.innerHTML = `<a class="btn small" href="https://wa.me/?text=${encodeURIComponent(text + " " + url)}" target="_blank" rel="noopener">💬 ${t("share.whatsapp")}</a>
    <button type="button" class="btn small" id="shareCopy">🔗 ${t("share.copy")}</button><span class="muted" id="shareMsg"></span>`;
  alt.hidden = false;
  document.getElementById("shareCopy").onclick = async () => {
    try { await navigator.clipboard.writeText(text + " " + url); document.getElementById("shareMsg").textContent = t("share.copied"); }
    catch { prompt(t("share.copy"), url); }
  };
}

// Ehrentitel nach Zahl aller eigenen Bewertungen (höchster zuerst)
const TITLES = [[60, "👑", "rank.t5"], [30, "🎖️", "rank.t4"], [15, "🏰", "rank.t3"], [5, "⚔️", "rank.t2"], [1, "🪣", "rank.t1"]];
const userCounts = new Map();
const titleOf = n => TITLES.find(([min]) => n >= min);
const titleText = tt => `${tt[1]} ${t(tt[2])}`;
function titleBadge(uid) {
  const tt = titleOf(userCounts.get(uid) || 0);
  return tt ? `<span class="rbadge">${titleText(tt)}</span>` : "";
}
async function loadCounts(ids) {
  const need = [...new Set(ids.filter(id => id && !userCounts.has(id)))];
  if (!need.length) return;
  const { data, error } = await db.rpc("review_counts", { ids: need });
  if (error) return;                       // ohne die Datenbank-Funktion einfach keine Titel
  need.forEach(id => userCounts.set(id, 0));
  (data ?? []).forEach(r => userCounts.set(r.user_id, r.reviews));
}
function levelsHtml(n) {
  const me = titleOf(n);
  return TITLES.slice().reverse().map(tt => `<div class="lvl ${tt === me ? "lvl-me" : ""}"><span>${titleText(tt)}</span><span class="muted">${t("rank.from", { n: tt[0] })}</span></div>`).join("");
}
function myRankHtml() {
  const n = userCounts.get(user.id) || 0, asc = TITLES.slice().reverse(), next = asc.find(([min]) => n < min);
  const prev = titleOf(n)?.[0] ?? 0, pct = next ? Math.round((n - prev) / (next[0] - prev) * 100) : 100;
  const line = !n ? t("rank.none") : next ? t("rank.progress", { n, k: next[0] - n, next: titleText(next) }) : t("rank.max", { n });
  return `<div class="card-ish"><b>${t("rank.mine")}</b>${n ? ` <span class="rbadge">${titleText(titleOf(n))}</span>` : ""}
    <div class="progress"><i style="width:${pct}%"></i></div><div class="muted">${line}</div>
    <details style="margin-top:6px"><summary class="muted">${t("rank.titles.title")}</summary><p class="muted">${t("rank.titles.explain")}</p>${levelsHtml(n)}</details></div>`;
}

// Admin: Seitenaufrufe (Startseite und Karte) pro Tag
async function showStats() {
  const { data, error } = await db.rpc("admin_page_views");
  const rows = data ?? [];
  const dayOf = n => new Date(Date.now() - n * 864e5).toISOString().slice(0, 10);   // Tage in UTC wie in der Datenbank
  const match = (r, page) => !page || (page === "city" ? r.page.startsWith("city:") : r.page === page);
  const sum = (from, page) => rows.filter(r => r.day >= from && match(r, page)).reduce((s, r) => s + Number(r.views), 0);
  const perDay = [...Array(14)].map((_, i) => { const d = dayOf(i); return { d, n: sum(d, null) - sum(dayOf(i - 1), null) }; });
  const max = Math.max(1, ...perDay.map(x => x.n));
  const cell = (label, from) => `<div class="kpi"><span>${label}</span><strong>${fmtNum(sum(from))}</strong>
    <small>${t("adm.pHome")} ${fmtNum(sum(from, "home"))} · ${t("adm.pMap")} ${fmtNum(sum(from, "map"))} · ${t("adm.pCity")} ${fmtNum(sum(from, "city"))}</small></div>`;
  // Beliebteste Städte-Seiten der letzten 30 Tage
  const cityTotals = {};
  rows.filter(r => r.day >= dayOf(29) && r.page.startsWith("city:")).forEach(r => { const k = r.page.slice(5); cityTotals[k] = (cityTotals[k] || 0) + Number(r.views); });
  const topCities = Object.entries(cityTotals).sort((a, b) => b[1] - a[1]).slice(0, 10);
  sheet.innerHTML = `${closeBtn()}<h2>${t("adm.statsTitle")}</h2>
    ${error ? `<p class="error">${t("adm.failed", { e: esc(error.message) })}</p>` : !rows.length ? `<p class="muted">${t("adm.noData")}</p>` : `
    <div class="kpis">${cell(t("adm.today"), dayOf(0))}${cell(t("adm.week"), dayOf(6))}${cell(t("adm.month"), dayOf(29))}${cell(t("adm.total"), "0000")}</div>
    <div class="bars">${perDay.map(x => `<div class="bar"><span>${new Date(x.d + "T12:00:00Z").toLocaleDateString(LOCALE, { weekday: "short", day: "numeric", month: "numeric" })}</span><i style="--w:${x.n / max * 100}%"></i><b>${fmtNum(x.n)}</b></div>`).join("")}</div>
    <h3 style="margin-top:16px">${t("adm.topCities")}</h3>
    ${topCities.length ? `<div class="bars">${topCities.map(([k, n]) => `<div class="bar"><span>${esc(k)}</span><i style="--w:${n / topCities[0][1] * 100}%"></i><b>${fmtNum(n)}</b></div>`).join("")}</div>` : `<p class="muted">${t("adm.noCities")}</p>`}`}
    <p class="muted">${t("adm.statsHint")}</p>`;
  sheet.hidden = false;
}

// Links aus unseren E-Mails führen hierher (?token_hash=…&type=…). Der Code wird erst nach einem Klick eingelöst,
// weil Virenscanner von Mailprogrammen Links automatisch öffnen und Einmal-Links sonst vorher verbrauchen.
function handleEmailLink() {
  const q = new URLSearchParams(location.search), h = new URLSearchParams(location.hash.slice(1));
  const tokenHash = q.get("token_hash"), type = q.get("type");
  const failed = h.get("error_code") || q.get("error_code");
  if (!tokenHash && !failed) return;
  history.replaceState(null, "", location.pathname);
  const invalid = () => {
    sheet.innerHTML = `${closeBtn()}<h2>${t("link.invalidTitle")}</h2><p>${t("link.invalid")}</p>
      <div class="actions"><button type="button" class="btn primary" id="newLink">${t("link.newLink")}</button></div>`;
    sheet.hidden = false;
    document.getElementById("newLink").onclick = () => showForgot();
  };
  if (!tokenHash) return invalid();
  const recovery = type === "recovery";
  sheet.innerHTML = `${closeBtn()}<h2>${recovery ? t("auth.newPwTitle") : t("link.confirmTitle")}</h2>
    <p class="muted">${t("link.text")}</p><p class="error" id="linkErr"></p>
    <div class="actions"><button type="button" class="btn primary" id="linkGo">${t("link.go")}</button></div>`;
  sheet.hidden = false;
  document.getElementById("linkGo").onclick = async () => {
    const { error } = await db.auth.verifyOtp({ token_hash: tokenHash, type });
    if (error) return invalid();
    await refreshUser();
    if (recovery) return showNewPassword();
    sheet.innerHTML = `${closeBtn()}<h2 class="hello">${throneMark}${t("link.confirmed")}</h2>`;
  };
}

// Beim Öffnen direkt zum eigenen Standort springen. Beim ersten Mal fragt der Browser um Erlaubnis;
// wurde sie verweigert, fragen wir nicht erneut. Der Standort bleibt im Browser (siehe Datenschutz).
async function autoLocate() {
  if (!navigator.geolocation) return;
  try { const st = await navigator.permissions?.query({ name: "geolocation" }); if (st?.state === "denied") return; } catch {}
  status(t("m.status.locating"));
  try {
    const pos = await locate();
    if (!userMoved && !planPos) map.setView(pos, 16);
    status("");
    updateInfo();
  } catch { status(""); }
}
