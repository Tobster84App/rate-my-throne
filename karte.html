<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
/* Layout: königliche Kopfleiste, Vollbild-Karte, Infokarte rechts (Handy: oben), runde Kartenknöpfe links unten, Details als Bottom-Sheet */
:root {
  --royal: #2a1f4d; --royal-2: #3d2f6e; --gold: #e3b341; --gold-deep: #b8871c;
  --bg: #f5f3fa; --surface: #ffffff; --fg: #1f1a2e; --muted: #6b6480; --line: #e3dfee;
  --good: #1f9d63; --mid: #e3a21a; --bad: #d14b3a; --none: #8a849b; --warn: #c0392b;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --shadow: 0 6px 24px rgba(42, 31, 77, .18);
  --radius: 16px;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #15121f; --surface: #211c31; --fg: #efecf7; --muted: #a49cbc; --line: #352e4c;
    --royal: #1b1433; --royal-2: #2e2454; --shadow: 0 6px 24px rgba(0,0,0,.45); color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--body); display: flex; flex-direction: column; overflow: hidden; }
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* Kopfleiste */
header { background: var(--royal); color: #fff; display: flex; align-items: center; gap: 12px;
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); z-index: 1100; }
.brand { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; color: inherit; text-decoration: none; }
.brand svg { width: 34px; height: 34px; flex: none; }
.brand h1 { font: 800 21px/1 var(--display); margin: 0; letter-spacing: -.3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand h1 span { color: var(--gold); }
.lang { flex: none; color: rgba(255,255,255,.85); text-decoration: none; font-weight: 700; font-size: 13px; border: 1px solid rgba(255,255,255,.3); border-radius: 999px; padding: 6px 10px; }
.lang:hover { color: #fff; border-color: #fff; }
#btnUser { flex: none; background: var(--gold); color: var(--royal); border: none; border-radius: 999px; padding: 8px 16px; font-weight: 700; white-space: nowrap; max-width: 38vw; overflow: hidden; text-overflow: ellipsis; }

/* Karte */
main { position: relative; flex: 1; min-height: 0; }
#map { position: absolute; inset: 0; background: #ddd8e8; }
.leaflet-container { font-family: var(--body); }

/* Marker */
.pin { width: 38px; height: 38px; border-radius: 50% 50% 50% 4px; transform: rotate(-45deg); display: grid; place-items: center;
  border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.35); }
.pin b { transform: rotate(45deg); color: #fff; font: 800 13px/1 var(--display); }
.pin.none b { font-size: 11px; font-weight: 700; }
.pin.nearest { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(227,179,65,.45), 0 2px 8px rgba(0,0,0,.35); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 12px rgba(227,179,65,0), 0 2px 8px rgba(0,0,0,.35); } }
.me { width: 18px; height: 18px; border-radius: 50%; background: #2f7bf5; border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(47,123,245,.25); }

/* Infokarte */
#info { position: absolute; z-index: 900; top: 16px; right: max(16px, env(safe-area-inset-right, 0px)); width: 270px;
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; display: grid; gap: 12px; }
#info h2 { margin: 0; font: 700 13px/1 var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.stats { display: grid; gap: 10px; }
.stat { display: grid; grid-template-columns: 1fr auto; align-items: baseline; gap: 8px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.stat:last-child { border-bottom: none; padding-bottom: 0; }
.stat span { color: var(--muted); font-size: 14px; }
.stat strong { font: 800 22px/1 var(--display); font-variant-numeric: tabular-nums; }
.stat small { grid-column: 1 / -1; color: var(--muted); font-size: 12px; margin-top: -4px; }
#btnNearest { background: var(--royal); color: #fff; border: none; border-radius: 12px; padding: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; }
#btnNearest:hover { background: var(--royal-2); }
#btnNearest svg { width: 18px; height: 18px; }

/* Runde Kartenknöpfe */
.fabs { position: absolute; z-index: 900; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 24px; display: grid; gap: 10px; }
.fab { width: 50px; height: 50px; border-radius: 50%; border: none; background: var(--surface); color: var(--royal); box-shadow: var(--shadow); display: grid; place-items: center; }
.fab svg { width: 24px; height: 24px; }
.fab.gold { background: var(--gold); color: var(--royal); }
@media (prefers-color-scheme: dark) { .fab { color: var(--gold); } .fab.gold { color: var(--royal); } #btnNearest, #btnNearest:hover { background: var(--gold); color: var(--royal); } }
.fab.active { outline: 3px solid var(--gold); }
.fab { position: relative; }
.fab-badge { position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; background: var(--gold); color: var(--royal); font: 800 12px/20px var(--display); text-align: center; }

#status { position: absolute; z-index: 950; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: calc(100% - 160px);
  background: var(--royal); color: #fff; padding: 8px 14px; border-radius: 999px; font-size: 13px; box-shadow: var(--shadow); text-align: center; }

/* Werbefläche */
#ad a { color: inherit; }
#ad { background: var(--surface); border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; text-align: center;
  padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }

/* Detail-Sheet */
#sheet { position: fixed; z-index: 1200; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 0; width: min(440px, calc(100% - 32px));
  max-height: 78%; overflow-y: auto; background: var(--surface); border-radius: 20px 20px 0 0; box-shadow: var(--shadow);
  padding: 8px 20px calc(20px + env(safe-area-inset-bottom, 0px)); }
#sheet::before { content: ""; display: block; width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto 12px; }
#sheet h2 { margin: 0 0 4px; font: 800 22px/1.15 var(--display); text-wrap: balance; padding-right: 40px; }
.close { position: absolute; top: 14px; right: 14px; width: 34px; height: 34px; border-radius: 50%; border: none; background: var(--bg); color: var(--fg); font-size: 18px; line-height: 1; }
.muted { color: var(--muted); font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
.chip { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 4px 10px; background: var(--bg); color: var(--muted); }
.chip.yes { background: rgba(31,157,99,.14); color: var(--good); }
.chip.no { background: rgba(209,75,58,.12); color: var(--bad); }
.score { display: flex; align-items: center; gap: 14px; margin: 8px 0 4px; }
.score .big { font: 800 40px/1 var(--display); }
.score .big small { font-size: 16px; color: var(--muted); font-weight: 600; }
.bars { display: grid; gap: 6px; margin: 10px 0; }
.bar { display: grid; grid-template-columns: 110px 1fr 28px; align-items: center; gap: 8px; font-size: 13px; }
.bar i { display: block; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar i::after { content: ""; display: block; height: 100%; width: var(--w); background: var(--gold); border-radius: 4px; }
.bar b { text-align: right; font-variant-numeric: tabular-nums; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 4px; }
.btn { border-radius: 12px; padding: 10px 16px; font-weight: 700; border: 1px solid var(--line); background: var(--surface); color: var(--fg); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn.primary { background: var(--royal); color: #fff; border-color: var(--royal); }
.btn.gold { background: var(--gold); color: var(--royal); border-color: var(--gold); }
@media (prefers-color-scheme: dark) { .btn.primary { background: var(--gold); color: var(--royal); border-color: var(--gold); } }
.stars { display: flex; gap: 2px; }
.stars button { border: none; background: none; padding: 0 2px; font-size: 30px; line-height: 1; color: var(--line); }
.stars button.on { color: var(--gold); }
label { display: block; margin-top: 12px; font-weight: 600; font-size: 14px; }
input[type=text], input[type=email], input[type=password], textarea { width: 100%; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); margin-top: 4px; }
.check { font-weight: 500; display: flex; gap: 8px; align-items: center; margin-top: 8px; }
.check input { width: 18px; height: 18px; accent-color: var(--royal); }
.review { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; }
.review p { margin: 4px 0 0; }
.error { color: var(--warn); font-size: 13px; min-height: 1em; }
.adding #map { cursor: crosshair; }
.empty { display: flex; gap: 10px; align-items: center; }
.empty svg { width: 32px; height: 32px; flex: none; }
#sheet h2.hello { display: flex; gap: 10px; align-items: center; overflow-wrap: anywhere; }
.hello svg { width: 30px; height: 30px; flex: none; }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.danger.solid { background: var(--bad); color: #fff; }
.linkbtn { border: none; background: none; padding: 0; color: var(--muted); text-decoration: underline; font-size: 13px; margin-top: 10px; }
.ok { color: var(--good); }
.rev-actions { display: flex; gap: 8px; margin-top: 8px; }
.btn.small { padding: 7px 14px; font-size: 13px; border-radius: 10px; }
.rscore { display: inline-block; min-width: 34px; text-align: center; color: #fff; font: 800 12px/1 var(--display); border-radius: 999px; padding: 4px 7px; margin-right: 6px; vertical-align: 1px; }
.trend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); margin: 4px 0 8px; }
.trend b { color: var(--fg); }
.trend .up { color: var(--good); font-weight: 700; } .trend .down { color: var(--bad); font-weight: 700; }
.report-form { margin-top: 8px; padding: 10px 12px; background: var(--bg); border-radius: 10px; }
.report-form label.check { margin-top: 4px; }
.badge { display: inline-block; font-size: 12px; font-weight: 700; color: var(--royal); background: var(--gold); border-radius: 999px; padding: 3px 10px; margin: 2px 0 6px; }
.report-item { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 10px; }

/* Handy: Infokarte oben als kompakte Leiste */
@media (max-width: 640px) {
  .brand h1 { font-size: 18px; }
  .brand svg { width: 28px; height: 28px; }
  #info { left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); top: 12px; width: auto; padding: 12px; gap: 10px; }
  #info h2 { display: none; }
  .stats { grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .stat { grid-template-columns: 1fr; border-bottom: none; padding-bottom: 0; border-right: 1px solid var(--line); text-align: center; gap: 2px; }
  .stat:last-child { border-right: none; }
  .stat span { font-size: 11px; order: 2; }
  .stat strong { font-size: 19px; }
  .stat small { display: none; }
  #btnNearest { padding: 10px; }
  #sheet { left: 0; width: 100%; }
  #status { max-width: calc(100% - 100px); }
}
@media (prefers-reduced-motion: reduce) { .pin.nearest { animation: none; } }
</style>
</head>
<body>
<header>
  <a class="brand" href="./" data-i18n-title="brand.home">
    <svg viewBox="86 100 340 332" aria-hidden="true"><path d="M120 300 104 150l84 70 68-110 68 110 84-70-16 150z" fill="#e3b341"/><ellipse cx="256" cy="330" rx="142" ry="74" fill="none" stroke="#e3b341" stroke-width="36"/></svg>
    <h1>Rate My <span>Throne</span></h1>
  </a>
  <a class="lang" data-lang-switch href="?lang=en">EN</a>
  <button id="btnUser" type="button" data-i18n="auth.login">Anmelden</button>
</header>

<main>
  <div id="map"></div>

  <aside id="info" data-i18n-aria-label="m.info.aria">
    <h2 data-i18n="m.info.heading">Hier in der Gegend</h2>
    <div class="stats">
      <div class="stat"><span data-i18n="m.info.toilets">Toiletten</span><strong id="sCount">–</strong><small id="sCountNote" data-i18n="m.info.toiletsNote">im sichtbaren Kartenausschnitt</small></div>
      <div class="stat"><span data-i18n="m.info.avg">Ø Bewertung</span><strong id="sAvg">–</strong><small id="sAvgNote" data-i18n="m.info.noReviews">noch keine Bewertungen</small></div>
      <div class="stat"><span data-i18n="m.info.nearest">Nächste</span><strong id="sNear">–</strong><small id="sNearNote" data-i18n="m.info.fromCenter">ab Kartenmitte</small></div>
    </div>
    <button id="btnNearest" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>
      <span data-i18n="m.btn.nearest">Nächsten Thron finden</span>
    </button>
  </aside>

  <div class="fabs">
    <button id="btnFilter" class="fab" type="button" data-i18n-aria-label="f.title" data-i18n-title="f.title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg>
      <span class="fab-badge" id="filterCount" hidden></span>
    </button>
    <button id="btnAdd" class="fab gold" type="button" data-i18n-aria-label="m.fab.add" data-i18n-title="m.fab.add">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button id="btnLocate" class="fab" type="button" data-i18n-aria-label="m.fab.locate" data-i18n-title="m.fab.locate">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 3 3 10.5l7.5 3 3 7.5z"/></svg>
    </button>
  </div>

  <div id="status" hidden></div>
</main>

<div id="ad"><span data-i18n="m.ad">Anzeige · Werbefläche (Platzhalter)</span> · <a href="impressum.html" data-i18n="h.footer.imprint">Impressum</a> · <a href="datenschutz.html" data-i18n="h.footer.privacy">Datenschutz</a></div>
<div id="sheet" hidden></div>

<script src="i18n.js"></script>
<script src="vendor/leaflet.js"></script>
<script src="vendor/supabase.js"></script>
<script>
applyI18n();
document.title = t("m.title");

// ===== Verbindung zur Datenbank (Supabase). URL und publishable key dürfen öffentlich sein. =====
const SUPABASE_URL = "https://bzgeqaseogawdptaqzgq.supabase.co";
const SUPABASE_KEY = "sb_publishable_Uoawl08FsfsJwdv3eLVV0A_Zh5tT6EE";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let user = null;                 // { id, username, isAdmin } wenn angemeldet
let myReports = new Set();       // Bewertungen, die ich schon gemeldet habe
let myPos = null;                // [lat, lon] des Nutzers, sobald bekannt
let nearestId = null;            // hervorgehobene Toilette
const toilets = new Map();       // id -> toilet (OSM und eigene)
const reviews = new Map();       // toiletId -> [review]

const CATS = ["clean", "equip", "access"].map(key => ({ key, label: t("cat." + key) }));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ===== Karte =====
const map = L.map("map", { zoomControl: false }).setView([52.52, 13.405], 15); // Start: Berlin Mitte
L.control.zoom({ position: "bottomright" }).addTo(map);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
}).addTo(map);
const layer = L.layerGroup().addTo(map);
let meMarker = null, routeLine = null;

function status(msg, ms) {
  const el = document.getElementById("status");
  el.textContent = msg; el.hidden = !msg;
  if (ms) setTimeout(() => { if (el.textContent === msg) el.hidden = true; }, ms);
}

function avg(id) {
  const list = reviews.get(id) || [];
  if (!list.length) return null;
  return list.reduce((s, r) => s + CATS.reduce((a, c) => a + r[c.key], 0) / CATS.length, 0) / list.length;
}
const scoreColor = a => a == null ? "var(--none)" : a >= 4 ? "var(--good)" : a >= 2.5 ? "var(--mid)" : "var(--bad)";

function markerIcon(tl) {
  const a = avg(tl.id);
  const cls = "pin" + (a == null ? " none" : "") + (tl.id === nearestId ? " nearest" : "");
  return L.divIcon({ className: "", iconSize: [38, 38], iconAnchor: [19, 40],
    html: `<div class="${cls}" style="background:${scoreColor(a)}"><b>${a == null ? "WC" : fmtNum(a, 1)}</b></div>` });
}

// ===== Filter: kostenlos, barrierefrei, Wickeltisch, ab 4 Sternen, nur bewertete =====
// Toiletten ohne Angabe bleiben bei den Ausstattungs-Filtern sichtbar; ausgeblendet wird nur, was ausdrücklich nicht passt.
const FILTERS = ["free", "wheelchair", "changing", "good", "rated"];
let filters = new Set();
try { filters = new Set(JSON.parse(localStorage.getItem("rmt-filters") || "[]").filter(f => FILTERS.includes(f))); } catch {}

// Ausstattung aus OSM bzw. Eintrag; „ja“ auch, wenn mindestens die Hälfte der Bewertungen es ankreuzt.
// Ergebnis: "yes", "no", "limited" oder undefined (noch keine Angabe)
function feature(tl, key) {
  const list = reviews.get(tl.id) || [];
  const reviewKey = { free: "free", wheelchair: "barrierfree", changing: "changing" }[key];
  const tag = key === "free" ? (tl.fee === "no" ? "yes" : tl.fee === "yes" ? "no" : undefined) : tl[key];
  if (tag === "yes" || (list.length && list.filter(r => r[reviewKey]).length * 2 >= list.length)) return "yes";
  return tag === "no" || tag === "limited" ? tag : undefined;
}
function passes(tl) {
  for (const f of filters) {
    if (f === "rated" && avg(tl.id) == null) return false;
    if (f === "good" && !(avg(tl.id) >= 4)) return false;
    if (f !== "rated" && f !== "good" && feature(tl, f) === "no") return false;
  }
  return true;
}
const shown = () => [...toilets.values()].filter(passes);

function render() {
  layer.clearLayers();
  for (const tl of shown()) {
    L.marker([tl.lat, tl.lon], { icon: markerIcon(tl), zIndexOffset: tl.id === nearestId ? 1000 : 0 })
      .on("click", () => showToilet(tl)).addTo(layer);
  }
  updateInfo();
}

// ===== Entfernungen & Infokarte =====
function distance(a, b) { // Meter, Haversine
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (b[0] - a[0]) * rad, dLon = (b[1] - a[1]) * rad;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * rad) * Math.cos(b[0] * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const fmtDist = m => m < 1000 ? Math.round(m / 10) * 10 + " m" : fmtNum(m / 1000, 1) + " km";
const walkMin = m => Math.max(1, Math.round(m / 80)); // ca. 4,8 km/h

function nearestFrom(pos) {
  let best = null, bestD = Infinity;
  for (const tl of shown()) {
    const d = distance(pos, [tl.lat, tl.lon]);
    if (d < bestD) { best = tl; bestD = d; }
  }
  return best && { toilet: best, dist: bestD };
}

function updateInfo() {
  const b = map.getBounds();
  const visible = shown().filter(tl => b.contains([tl.lat, tl.lon]));
  document.getElementById("sCount").textContent = visible.length;
  document.getElementById("sCountNote").textContent = t(filters.size ? "m.info.toiletsFiltered" : "m.info.toiletsNote");
  const rated = visible.map(tl => avg(tl.id)).filter(a => a != null);
  const sAvg = document.getElementById("sAvg");
  if (rated.length) {
    const m = rated.reduce((s, a) => s + a, 0) / rated.length;
    sAvg.textContent = fmtNum(m, 1);
    sAvg.style.color = scoreColor(m);
    document.getElementById("sAvgNote").textContent = t("m.info.ratedOf", { n: rated.length, m: visible.length });
  } else {
    sAvg.textContent = "–"; sAvg.style.color = "";
    document.getElementById("sAvgNote").textContent = t("m.info.noReviews");
  }
  const from = myPos || [map.getCenter().lat, map.getCenter().lng];
  const n = nearestFrom(from);
  document.getElementById("sNear").textContent = n ? fmtDist(n.dist) : "–";
  document.getElementById("sNearNote").textContent = n ? (myPos ? t("m.info.fromYou", { min: walkMin(n.dist) }) : t("m.info.fromCenter")) : t("m.info.noneLoaded");
}

// ===== Daten laden =====
// Alle Toiletten kommen aus unserer Datenbank: osm_toilets (Kopie aus OpenStreetMap) und toilets (Community).
// Abgefragt wird in Kacheln von 0,05° (ca. 4–5 km); jede Kachel nur einmal pro Besuch.
// Kennt die Datenbank eine Gegend noch nicht (1°-Kachel), stößt die App einmalig den Import an.
const TILE = 0.05;
const loadedTiles = new Set();
const importAsked = new Set();

function tilesFor(bounds, size) {
  const out = [];
  for (let y = Math.floor(bounds.getSouth() / size); y <= Math.floor(bounds.getNorth() / size); y++)
    for (let x = Math.floor(bounds.getWest() / size); x <= Math.floor(bounds.getEast() / size); x++) out.push(x + "_" + y);
  return out;
}
function unionBox(keys, size) {
  const xs = keys.map(k => +k.split("_")[0]), ys = keys.map(k => +k.split("_")[1]);
  return [Math.min(...ys) * size, Math.min(...xs) * size, (Math.max(...ys) + 1) * size, (Math.max(...xs) + 1) * size];
}

async function loadOsm(box) {
  const { data, error } = await db.from("osm_toilets").select("id,lat,lon,name,operator,fee,wheelchair,changing_table,opening_hours")
    .gte("lat", box[0]).lte("lat", box[2]).gte("lon", box[1]).lte("lon", box[3]).limit(5000);
  if (error) throw new Error(t("m.err.osm") + ": " + error.message);
  for (const r of data) {
    toilets.set(r.id, { id: r.id, lat: r.lat, lon: r.lon, source: "OpenStreetMap",
      name: r.name || r.operator || t("m.toilet.default"),
      fee: r.fee, wheelchair: r.wheelchair, changing: r.changing_table, hours: r.opening_hours });
  }
}

const yn = v => v == null ? undefined : v ? "yes" : "no";
async function loadOwn(box) {
  const { data, error } = await db.from("toilets").select("*, profiles(username)")
    .gte("lat", box[0]).lte("lat", box[2]).gte("lon", box[1]).lte("lon", box[3]);
  if (error) throw new Error(t("m.err.own") + ": " + error.message);
  for (const tl of data) {
    toilets.set(tl.id, { id: tl.id, lat: tl.lat, lon: tl.lon, name: tl.name, own: true, createdBy: tl.created_by,
      source: tl.profiles?.username ? t("m.toilet.by", { u: tl.profiles.username }) : t("m.toilet.community"),
      fee: yn(tl.fee), wheelchair: yn(tl.wheelchair), changing: yn(tl.changing_table) });
  }
}

async function loadReviews(ids) {
  for (let i = 0; i < ids.length; i += 100) {
    const chunk = ids.slice(i, i + 100);
    const { data, error } = await db.from("reviews").select("*, profiles(username)").in("toilet_ref", chunk);
    if (error) throw new Error(t("m.err.reviews") + ": " + error.message);
    for (const id of chunk) reviews.set(id, []);
    for (const r of data) reviews.get(r.toilet_ref).push(r);
  }
}

// Lädt die noch fehlenden 0,05°-Kacheln im sichtbaren Bereich aus der Datenbank
async function loadArea(bounds) {
  const keys = tilesFor(bounds, TILE).filter(k => !loadedTiles.has(k));
  if (!keys.length) return [];
  keys.forEach(k => loadedTiles.add(k));
  const box = unionBox(keys, TILE);
  const failed = [];
  await Promise.all([loadOsm(box), loadOwn(box)].map(p => p.catch(err => { failed.push(err.message); keys.forEach(k => loadedTiles.delete(k)); })));
  try { await loadReviews([...toilets.keys()].filter(id => !reviews.has(id))); } catch (err) { failed.push(err.message); }
  render();
  return failed;
}

// Stößt den Import für Gegenden an, die die Datenbank noch nicht kennt.
// Ergebnis: fresh = neue Daten da, busy = Import läuft noch woanders oder schlug fehl
let retryTimer;
async function ensureImported(bounds) {
  const keys = tilesFor(bounds, 1).filter(k => !importAsked.has(k)).slice(0, 2);
  if (!keys.length) return {};
  keys.forEach(k => importAsked.add(k));
  const { data: rows, error } = await db.from("osm_tiles").select("key,status").in("key", keys);
  if (error) return {};
  const ok = new Set(rows.filter(r => r.status === "ok").map(r => r.key));
  const missing = keys.filter(k => !ok.has(k));
  if (!missing.length) return {};
  status(t("m.status.importing"));
  await db.rpc("request_osm_tiles", { keys: missing });
  // Die Datenbank holt die Daten im Hintergrund; alle 5 s nachsehen, höchstens 90 s lang
  const done = new Set();
  for (let i = 0; i < 18 && done.size < missing.length; i++) {
    await new Promise(res => setTimeout(res, 5000));
    const { data } = await db.from("osm_tiles").select("key,status").in("key", missing);
    (data ?? []).filter(r => r.status === "ok").forEach(r => done.add(r.key));
    if ((data ?? []).length === missing.length && data.every(r => r.status === "ok" || r.status === "error")) break;
  }
  const notDone = missing.filter(k => !done.has(k));
  if (notDone.length) {
    // Läuft gerade woanders oder ist fehlgeschlagen: später nochmal versuchen
    notDone.forEach(k => importAsked.delete(k));
    clearTimeout(retryTimer); retryTimer = setTimeout(loadToilets, 30000);
  }
  return { fresh: done.size > 0, busy: notDone.length > 0 && !done.size };
}

async function loadToilets() {
  if (map.getZoom() < 13) { status(t("m.status.zoom"), 2500); updateInfo(); return; }
  const b = map.getBounds();
  if (tilesFor(b, TILE).some(k => !loadedTiles.has(k))) status(t("m.status.loading"));
  const failed = await loadArea(b);
  const imp = await ensureImported(b);
  if (imp.fresh) {
    tilesFor(b, TILE).forEach(k => loadedTiles.delete(k));
    failed.push(...await loadArea(b));
  }
  if (failed.length) status(t("m.status.partial", { e: failed.join("; ") }), 6000);
  else if (imp.busy) status(t("m.status.importBusy"), 5000);
  else status("");
  updateInfo();
}
let moveTimer;
map.on("moveend", () => { updateInfo(); clearTimeout(moveTimer); moveTimer = setTimeout(loadToilets, 400); });

// ===== Standort & nächster Thron =====
function locate() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error(t("m.err.noGeo")));
    navigator.geolocation.getCurrentPosition(p => {
      myPos = [p.coords.latitude, p.coords.longitude];
      if (meMarker) meMarker.setLatLng(myPos);
      else meMarker = L.marker(myPos, { icon: L.divIcon({ className: "", iconSize: [18, 18], html: '<div class="me"></div>' }), interactive: false }).addTo(map);
      resolve(myPos);
    }, () => reject(new Error(t("m.err.geo"))), { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
  });
}

document.getElementById("btnLocate").onclick = async () => {
  status(t("m.status.locating"));
  try { const pos = await locate(); map.setView(pos, 16); status(""); }
  catch (err) { status(err.message, 4000); }
};

document.getElementById("btnNearest").onclick = async () => {
  status(t("m.status.searching"));
  let from;
  try { from = await locate(); }
  catch { from = [map.getCenter().lat, map.getCenter().lng]; status(t("m.status.fallback"), 2500); }
  map.setView(from, Math.max(map.getZoom(), 15), { animate: false });
  clearTimeout(moveTimer);
  await loadToilets();
  const n = nearestFrom(from);
  if (!n) { status(t("m.status.none"), 4000); return; }
  nearestId = n.toilet.id;
  if (routeLine) routeLine.remove();
  routeLine = L.polyline([from, [n.toilet.lat, n.toilet.lon]], { color: "#e3b341", weight: 4, dashArray: "6 8" }).addTo(map);
  render();
  map.fitBounds(L.latLngBounds([from, [n.toilet.lat, n.toilet.lon]]).pad(0.4), { maxZoom: 17 });
  status("");
  showToilet(n.toilet, n.dist);
};

function showToilet(tl, dist) {

        <div class="muted">${CATS.map(c => c.label + " " + r[c.key]).join(" · ")}${r.free ? " · " + t("m.review.free") : ""}${r.barrierfree ? " · " + t("m.review.barrierfree") : ""}${r.changing ? " · " + t("m.review.changing") : ""}</div>

// Eingetragene Toiletten (nicht OpenStreetMap): eigene ohne fremde Bewertungen oder als Admin löschbar
function canDeleteToilet(tl, list) {
  if (!user || !tl.own) return false;
  return user.isAdmin || tl.createdBy === user.id;
}

function bindToiletDelete(tl) {
  const btn = document.getElementById("delToilet");
  if (!btn) return;
  const msg = document.getElementById("delToiletMsg");
  btn.onclick = async () => {
    const foreign = (reviews.get(tl.id) || []).some(r => r.user_id !== user.id);
    if (foreign && !user.isAdmin) { msg.textContent = t("toilet.notAllowed"); return; }
    // Erster Klick fragt nach, zweiter löscht
    if (!btn.dataset.sure) { btn.dataset.sure = "1"; btn.textContent = t("toilet.deleteYes"); btn.classList.add("solid"); msg.textContent = t("toilet.deleteSure"); return; }
    const { data, error } = await db.from("toilets").delete().eq("id", tl.id).select("id");
    if (error) { msg.textContent = t("toilet.deleteFailed", { e: error.message }); return; }
    if (!data.length) { msg.textContent = t("toilet.notAllowed"); return; }
    toilets.delete(tl.id); reviews.delete(tl.id);
    if (nearestId === tl.id) { nearestId = null; if (routeLine) { routeLine.remove(); routeLine = null; } }
    render();
    sheet.innerHTML = `${closeBtn()}<p class="muted empty">${throneMark}<span>${t("toilet.deleted")}</span></p>`;
  };
}

// Gesamtnote einer einzelnen Bewertung
const revScore = r => CATS.reduce((a, c) => a + r[c.key], 0) / CATS.length;

// Vergleich: Bewertungen der letzten 3 Monate gegen die älteren (nur wenn es beides gibt)
function trendLine(list) {
  const cut = Date.now() - 90 * 864e5;
  const recent = list.filter(r => Date.parse(r.created_at) >= cut), older = list.filter(r => Date.parse(r.created_at) < cut);
  if (!recent.length || !older.length) return "";
  const mean = l => l.reduce((s, r) => s + revScore(r), 0) / l.length;
  const a = mean(recent), b = mean(older), diff = a - b;
  const verdict = diff >= 0.3 ? `<span class="up">↑ ${t("hist.better")}</span>` : diff <= -0.3 ? `<span class="down">↓ ${t("hist.worse")}</span>` : `<span>→ ${t("hist.same")}</span>`;
  return `<div class="trend"><span>${t("hist.recent")}: <b>${fmtNum(a, 1)}</b></span><span>${t("hist.before")}: <b>${fmtNum(b, 1)}</b></span>${verdict}</div>`;
}

// ===== Moderation: eigene Bewertungen löschen, fremde melden; Admins dürfen alles löschen =====
function reviewActions(r) {
  if (!user) return "";
  const own = r.user_id === user.id;
  const parts = [];
  if (own || user.isAdmin) parts.push(`<button type="button" class="btn small danger" data-del="${r.id}">${t("mod.delete")}</button>`);
  if (!own) parts.push(myReports.has(r.id) ? `<span class="muted">${t("mod.reported")}</span>`
                                            : `<button type="button" class="btn small" data-rep="${r.id}">${t("mod.report")}</button>`);
  return `<div class="rev-actions">${parts.join("")}</div>`;
}

// Löscht eine Bewertung; gibt eine Fehlermeldung zurück oder null
async function deleteReview(id) {
  const { data, error } = await db.from("reviews").delete().eq("id", id).select("id");
  if (error) return t("mod.deleteFailed", { e: error.message });
  if (!data.length) return t("mod.notAllowed");   // von den Zugriffsregeln abgelehnt
  for (const [key, list] of reviews) reviews.set(key, list.filter(r => r.id !== id));
  render();
  return null;
}

function bindReviewActions(tl) {
  sheet.querySelectorAll("[data-del]").forEach(btn => btn.onclick = async () => {
    // Erster Klick fragt nach, zweiter löscht
    if (!btn.dataset.sure) { btn.dataset.sure = "1"; btn.textContent = t("mod.deleteSure"); btn.classList.add("solid"); return; }
    const msg = await deleteReview(+btn.dataset.del);
    if (msg) { btn.textContent = msg; return; }
    showToilet(tl);
  });
  sheet.querySelectorAll("[data-rep]").forEach(btn => btn.onclick = () => {

      <p class="error"></p>
      <div class="actions"><button type="submit" class="btn primary">${t("mod.send")}</button>
      <button type="button" class="btn" data-cancel>${t("cancel")}</button></div>`;
    box.append(form);
    form.querySelector("[data-cancel]").onclick = () => form.remove();
    form.onsubmit = async e => {
      e.preventDefault();
      const { error } = await db.from("review_reports").insert({ review_id: id,
        reason: form.reason.value, note: form.querySelector("input[type=text]").value.trim() || null });
      if (error && error.code !== "23505") { form.querySelector(".error").textContent = t("mod.reportFailed", { e: error.message }); return; }
      myReports.add(id);
      showToilet(tl);
    };
  });
}

// Admin: offene Meldungen ansehen und bearbeiten
async function showReports() {
  const { data, error } = await db.from("review_reports")
    .select("id, reason, note, review_id, reviews(id, toilet_ref, comment, user_id, profiles(username))")

  sheet.innerHTML = `${closeBtn()}

    ${[...groups.values()].map(({ review: r, reports }) => `
      <div class="report-item" data-review="${r.id}">

        <p>${r.comment ? esc(r.comment) : `<span class="muted">${t("mod.noComment")}</span>`}</p>

        <p class="error"></p>
        <div class="actions"><button type="button" class="btn danger solid" data-act="delete">${t("mod.deleteReview")}</button>
        <button type="button" class="btn" data-act="dismiss">${t("mod.dismiss")}</button>
        <button type="button" class="btn" data-act="show" data-ref="${esc(r.toilet_ref)}">${t("mod.show")}</button></div>
      </div>`).join("")}`;
  sheet.hidden = false;
  sheet.querySelectorAll(".report-item").forEach(item => {

      free: fFree.checked, barrierfree: fBarrier.checked, changing: fChanging.checked,
      comment: fText.value.trim() || null }).select("*, profiles(username)").single();
    if (error) { err.textContent = error.code === "42501" ? t("hist.tooSoon") : t("m.rate.failed", { e: error.message }); return; }
    reviews.set(tl.id, [...(reviews.get(tl.id) || []), data]);
    render(); showToilet(tl);
  };
}

// ===== Registrierung / Anmeldung =====
function showAuth(after, mode = "login") {
  const reg = mode === "register";
  sheet.innerHTML = `
    ${closeBtn()}
    <h2>${reg ? t("auth.register") : t("auth.login")}</h2>
    <form id="authForm">
      <label for="aMail">${t("auth.email")}</label><input type="email" id="aMail" required autocomplete="email">
      ${reg ? `<label for="aUser">${t("auth.username")}</label><input type="text" id="aUser" required minlength="3" maxlength="30" pattern="[^@]+" autocomplete="username">` : ""}
      <label for="aPw">${t("auth.password")}</label><input type="password" id="aPw" required minlength="8" autocomplete="${reg ? "new-password" : "current-password"}">
      <p class="error" id="authErr"></p>
      <div class="actions"><button type="submit" class="btn primary">${reg ? t("auth.register") : t("auth.login")}</button>
      <button type="button" class="btn" id="switchMode">${reg ? t("auth.haveAccount") : t("auth.newAccount")}</button></div>
      ${reg ? "" : `<button type="button" class="linkbtn" id="forgot">${t("auth.forgot")}</button>`}
    </form>`;
  sheet.hidden = false;
  document.getElementById("switchMode").onclick = () => showAuth(after, reg ? "login" : "register");
  if (!reg) document.getElementById("forgot").onclick = () => showForgot(after);
  document.getElementById("authForm").onsubmit = async e => {
    e.preventDefault();
    const err = document.getElementById("authErr");
    const email = aMail.value.trim(), password = aPw.value;
    err.textContent = "";
    if (reg) {
      const username = aUser.value.trim();
      const { data: taken } = await db.from("profiles").select("id").ilike("username", username.replace(/[\\%_]/g, "\\$&")).limit(1);
      if (taken?.length) { err.textContent = t("auth.taken"); return; }
      const { data, error } = await db.auth.signUp({ email, password, options: { data: { username, lang: LANG } } });
      if (error) { err.textContent = t("auth.regFailed", { e: error.message }); return; }
      if (!data.session) {
        sheet.innerHTML = `${closeBtn()}<h2>${t("auth.almostTitle")}</h2><p>${t("auth.almostText", { email: esc(email) })}</p>`;
        return;
      }
    } else {
      const { error } = await db.auth.signInWithPassword({ email, password });
      if (error) { err.textContent = error.message === "Email not confirmed" ? t("auth.confirmFirst") : t("auth.wrong"); return; }
    }
    await refreshUser();
    after ? after() : closeSheet();
  };
}

async function refreshUser() {
  const { data: { session } } = await db.auth.getSession();
  myReports = new Set();
  if (session) {
    const { data } = await db.from("profiles").select("username,is_admin").eq("id", session.user.id).single();
    user = { id: session.user.id, username: data?.username ?? session.user.email, isAdmin: !!data?.is_admin, openReports: 0 };
    const { data: mine } = await db.from("review_reports").select("review_id").eq("reporter", user.id);
    (mine ?? []).forEach(r => myReports.add(r.review_id));
    if (user.isAdmin) {
      const { data: all } = await db.from("review_reports").select("review_id");
      user.openReports = new Set((all ?? []).map(r => r.review_id)).size;
    }
  } else user = null;
  const btn = document.getElementById("btnUser");
  btn.textContent = user ? "👑 " + user.username + (user.openReports ? " (" + user.openReports + ")" : "") : t("auth.login");
}
document.getElementById("btnUser").onclick = () => {
  if (!user) return showAuth();
  sheet.innerHTML = `${closeBtn()}
    <h2 class="hello">${throneMark}${t("m.user.hello", { u: esc(user.username) })}</h2>
    ${user.isAdmin ? `<span class="badge">👑 ${t("mod.admin")}</span>` : ""}
    <div class="actions">${user.isAdmin ? `<button type="button" class="btn primary" id="reports">${t("mod.reports", { n: user.openReports })}</button>` : ""}
    <button type="button" class="btn" id="logout">${t("auth.logout")}</button>
    <button type="button" class="btn" id="rename">${t("acc.rename")}</button>
    <button type="button" class="btn" id="changePw">${t("acc.changePw")}</button>
    <button type="button" class="btn danger" id="delAcc">${t("acc.delete")}</button></div>`;
  sheet.hidden = false;
  document.getElementById("logout").onclick = async () => { await db.auth.signOut(); await refreshUser(); closeSheet(); };
  document.getElementById("changePw").onclick = showNewPassword;
  document.getElementById("rename").onclick = showRename;
  document.getElementById("delAcc").onclick = showDeleteAccount;
  if (user.isAdmin) document.getElementById("reports").onclick = showReports;
};

// ===== Passwort vergessen / neues Passwort / Konto löschen =====
function showForgot(after) {
  sheet.innerHTML = `
    ${closeBtn()}
    <h2>${t("auth.resetTitle")}</h2>
    <p class="muted">${t("auth.resetText")}</p>
    <form id="forgotForm">
      <label for="fMail">${t("auth.email")}</label><input type="email" id="fMail" required autocomplete="email">
      <p class="error" id="forgotMsg"></p>
      <div class="actions"><button type="submit" class="btn primary">${t("auth.resetSend")}</button>
      <button type="button" class="btn" id="backLogin">${t("auth.back")}</button></div>
    </form>`;
  sheet.hidden = false;
  document.getElementById("backLogin").onclick = () => showAuth(after);
  document.getElementById("forgotForm").onsubmit = async e => {
    e.preventDefault();
    const msg = document.getElementById("forgotMsg");
    // Der Link in der E-Mail führt zurück auf diese Seite; dort erscheint dann das Formular für das neue Passwort
    const { error } = await db.auth.resetPasswordForEmail(fMail.value.trim(), { redirectTo: location.origin + location.pathname });
    msg.className = error ? "error" : "ok";
    msg.textContent = error ? t("auth.resetFailed", { e: error.message }) : t("auth.resetSent");
  };
}

function showRename() {
  sheet.innerHTML = `
    ${closeBtn()}
    <h2>${t("acc.rename")}</h2>
    <form id="renameForm">
      <label for="rName">${t("acc.newName")}</label>
      <input type="text" id="rName" required minlength="3" maxlength="30" pattern="[^@]+" autocomplete="username" value="${esc(user.username.includes("@") ? "" : user.username)}">
      <p class="muted">${t("acc.renameHint")}</p>
      <p class="error" id="renameMsg"></p>
      <div class="actions"><button type="submit" class="btn primary">${t("acc.renameSave")}</button>
      <button type="button" class="btn" id="renameBack">${t("cancel")}</button></div>
    </form>`;
  sheet.hidden = false;
  document.getElementById("renameBack").onclick = () => document.getElementById("btnUser").click();
  document.getElementById("renameForm").onsubmit = async e => {
    e.preventDefault();
    const msg = document.getElementById("renameMsg");
    const { data, error } = await db.rpc("set_username", { new_name: rName.value });
    if (error) {
      const code = ["taken", "length", "at_sign"].find(c => error.message.includes(c));
      msg.className = "error";
      msg.textContent = code ? t({ taken: "acc.err.taken", length: "acc.err.length", at_sign: "acc.err.at" }[code]) : t("acc.err.other", { e: error.message });
      return;
    }
    // Eigener Name in schon geladenen Bewertungen sofort aktualisieren
    for (const list of reviews.values()) list.forEach(r => { if (r.user_id === user.id && r.profiles) r.profiles.username = data; });
    await refreshUser();
    msg.className = "ok";
    msg.textContent = t("acc.renamed", { u: data });
  };
}

function showNewPassword() {
  sheet.innerHTML = `
    ${closeBtn()}
    <h2>${t("auth.newPwTitle")}</h2>
    <form id="newPwForm">
      <label for="nPw">${t("auth.newPw")}</label><input type="password" id="nPw" required minlength="8" autocomplete="new-password">
      <p class="error" id="newPwMsg"></p>
      <div class="actions"><button type="submit" class="btn primary">${t("auth.newPwSave")}</button></div>
    </form>`;
  sheet.hidden = false;
  document.getElementById("newPwForm").onsubmit = async e => {
    e.preventDefault();
    const msg = document.getElementById("newPwMsg");
    const { error } = await db.auth.updateUser({ password: nPw.value });
    msg.className = error ? "error" : "ok";
    msg.textContent = error ? t("auth.newPwFailed", { e: error.message }) : t("auth.newPwDone");
  };
}

function showDeleteAccount() {
  sheet.innerHTML = `
    ${closeBtn()}
    <h2>${t("acc.deleteTitle")}</h2>
    <p>${t("acc.deleteText")}</p>
    <p class="error" id="delMsg"></p>
    <div class="actions"><button type="button" class="btn danger solid" id="delYes">${t("acc.deleteConfirm")}</button>
    <button type="button" class="btn" id="delNo">${t("cancel")}</button></div>`;
  sheet.hidden = false;
  document.getElementById("delNo").onclick = () => document.getElementById("btnUser").click();
  document.getElementById("delYes").onclick = async () => {
    const { error } = await db.rpc("delete_my_account");
    if (error) { document.getElementById("delMsg").textContent = t("acc.deleteFailed", { e: error.message }); return; }
    const gone = user.id;
    await db.auth.signOut();
    await refreshUser();
    for (const [id, list] of reviews) reviews.set(id, list.filter(r => r.user_id !== gone));
    render();
    sheet.innerHTML = `${closeBtn()}<h2 class="hello">${throneMark}${t("acc.deleted")}</h2>`;
  };
}

// Kommt jemand über den Link aus der „Passwort vergessen“-E-Mail, gleich das neue Passwort abfragen
db.auth.onAuthStateChange(event => {
  if (event === "PASSWORD_RECOVERY") setTimeout(async () => { await refreshUser(); showNewPassword(); }, 0);
});

// Links aus unseren E-Mails führen hierher (?token_hash=…&type=…). Der Code wird erst nach einem Klick eingelöst,
// weil Virenscanner von Mailprogrammen Links automatisch öffnen und Einmal-Links sonst vorher verbrauchen.
function handleEmailLink() {
  const q = new URLSearchParams(location.search), h = new URLSearchParams(location.hash.slice(1));
  const tokenHash = q.get("token_hash"), type = q.get("type");
  const failed = h.get("error_code") || q.get("error_code");
  if (!tokenHash && !failed) return;
  history.replaceState(null, "", location.pathname);
  const invalid = () => {
    sheet.innerHTML = `${closeBtn()}<h2>${t("link.invalidTitle")}</h2><p>${t("link.invalid")}</p>
      <div class="actions"><button type="button" class="btn primary" id="newLink">${t("link.newLink")}</button></div>`;
    sheet.hidden = false;
    document.getElementById("newLink").onclick = () => showForgot();
  };
  if (!tokenHash) return invalid();
  const recovery = type === "recovery";
  sheet.innerHTML = `${closeBtn()}<h2>${recovery ? t("auth.newPwTitle") : t("link.confirmTitle")}</h2>
    <p class="muted">${t("link.text")}</p><p class="error" id="linkErr"></p>
    <div class="actions"><button type="button" class="btn primary" id="linkGo">${t("link.go")}</button></div>`;
  sheet.hidden = false;
  document.getElementById("linkGo").onclick = async () => {
    const { error } = await db.auth.verifyOtp({ token_hash: tokenHash, type });
    if (error) return invalid();
    await refreshUser();
    if (recovery) return showNewPassword();
    sheet.innerHTML = `${closeBtn()}<h2 class="hello">${throneMark}${t("link.confirmed")}</h2>`;
  };
}

// ===== Filter-Fenster =====
function updateFilterBtn() {
  const badge = document.getElementById("filterCount");
  badge.textContent = filters.size; badge.hidden = !filters.size;
  document.getElementById("btnFilter").classList.toggle("active", filters.size > 0);
}
function setFilters(set) {
  filters = set;
  try { localStorage.setItem("rmt-filters", JSON.stringify([...set])); } catch {}
  // Hervorgehobener Thron passt nicht mehr: Markierung und Linie entfernen
  if (nearestId && toilets.has(nearestId) && !passes(toilets.get(nearestId))) { nearestId = null; if (routeLine) { routeLine.remove(); routeLine = null; } }
  render(); updateFilterBtn();
}
document.getElementById("btnFilter").onclick = () => {
  sheet.innerHTML = `${closeBtn()}<h2>${t("f.title")}</h2>
    <form id="filterForm">${FILTERS.map(f => `<label class="check"><input type="checkbox" value="${f}" ${filters.has(f) ? "checked" : ""}> ${t("f." + f)}</label>`).join("")}
    <p class="muted">${t("f.hint")}</p>
    <div class="actions"><button type="submit" class="btn primary">${t("f.apply")}</button>
    <button type="button" class="btn" id="filterReset">${t("f.reset")}</button></div></form>`;
  sheet.hidden = false;
  const form = document.getElementById("filterForm");
  form.onsubmit = e => { e.preventDefault(); setFilters(new Set([...form.querySelectorAll("input:checked")].map(i => i.value))); closeSheet(); };
  document.getElementById("filterReset").onclick = () => { setFilters(new Set()); closeSheet(); };
};
updateFilterBtn();

refreshUser(); loadToilets(); handleEmailLink();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
